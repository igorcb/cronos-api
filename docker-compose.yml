services:
  redis:
    container_name: cronos-api_redis
    image: redis:7.0.7
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    ports:
      - "6381:6379"

  web:
    container_name: cronos-api_web
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle check || bundle install && bundle exec rails s -p 4001 -b '0.0.0.0'"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - BUNDLE_PATH=/app/vendor/bundle
      - RAILS_MASTER_KEY=555a0dd81a9edb883545ccf6d7e168b7
      - REDIS_URL=redis://redis:6379/1
      # Banco no Postgres central de dev (infra-db): host pg, rede db-shared
      - DATABASE_URL=postgres://postgres:postgres@pg:5432/cronos_development
    ports:
      - "4001:4001"
    depends_on:
      redis:
        condition: service_started
    networks:
      - default
      - db-shared
    stdin_open: true
    tty: true

  worker:
    container_name: cronos-api_worker
    build: .
    command: bash -c "bundle check || bundle install && bundle exec sidekiq -e development -C config/sidekiq.yml -r ./config/environment.rb"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - BUNDLE_PATH=/app/vendor/bundle
      - RAILS_MASTER_KEY=555a0dd81a9edb883545ccf6d7e168b7
      - REDIS_URL=redis://redis:6379/1
      # Banco no Postgres central de dev (infra-db): host pg, rede db-shared
      - DATABASE_URL=postgres://postgres:postgres@pg:5432/cronos_development
    depends_on:
      redis:
        condition: service_started
    networks:
      - default
      - db-shared
    stdin_open: true
    tty: true

volumes:
  redis-data:

networks:
  db-shared:
    external: true
